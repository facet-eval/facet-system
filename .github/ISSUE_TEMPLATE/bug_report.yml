name: Bug report
description: Report reproducible incorrect behavior.
title: "[Bug]: "
labels: ["type: bug", "status: needs-triage"]
body:
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - sdk
        - core
        - harness-pi
        - preset-pi-default
        - preset-pi-graph
        - preset-pi-rag
        - preset-pi-lsp
        - preset-pi-lens
        - preset-pi-subagents
        - docs
        - examples
        - ci
        - unknown
    validations:
      required: true
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What is broken?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      placeholder: |
        1. Run ...
        2. Open ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      placeholder: |
        OS:
        Node:
        pnpm:
        FACET version/commit:
        Pi Coding Agent version, if relevant:
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Logs or trace excerpt
      render: text
    validations:
      required: false
