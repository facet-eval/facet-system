name: Feature request
description: Propose a user-visible feature or capability.
title: "[Feature]: "
labels: ["type: feature", "status: needs-triage"]
body:
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - sdk
        - core
        - harness-pi
        - presets
        - docs
        - examples
        - ci
        - unknown
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user or maintainer problem does this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the desired behavior, API, CLI, or workflow.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      placeholder: |
        - [ ] ...
        - [ ] ...
    validations:
      required: true
  - type: textarea
    id: risks
    attributes:
      label: Risks and compatibility
      description: Mention breaking changes, migration needs, or test impact.
    validations:
      required: false
