metadata:
  id: ring-default-specific-001
  name: "Ring Default — ring-2.6-1t:free, specific prompt only"
  description: >
    Tests inclusionai/ring-2.6-1t:free with only the default profile
    across three compound scenarios, using the specific prompt for
    every scenario. Matrix: 1 prompt × 3 scenarios × 1 profile ×
    1 model × 1 repetition = 3 runs.
  version: "0.1.0"
  author: "Diego"
  seed: 42
  framework_version: "0.1.0"
  harness:
    id: "pi"
    package: "@facet/harness-pi"
    version: "0.70.0"

environment:
  timeout_per_run_seconds: 900
  max_tokens_per_run: 200000
  max_total_cost_usd: 0.5
  workspace_strategy: "git_worktree"

varying_factors:
  - id: prompt_id
    description: "Prompt specificity — only specific is tested."
    levels:
      - id: specific

  - id: profile
    description: "Agent profile — only default is tested."
    levels:
      - id: default
        ref: "@facet/preset-pi-default"
        hash: "sha256:4177c4c688febb958650363d595884de86c2ff0872166baccc106def850e608e"

  - id: model
    description: >
      OpenRouter model id — inclusionai/ring-2.6-1t:free only.
    levels:
      - id: ring-2-6-1t-free
        provider: openrouter
        model_id: "inclusionai/ring-2.6-1t:free"

scenarios:
  - id: compound-python
    ref: "scenarios/compound-python"
    hash: "TBD"
  - id: compound-haskell
    ref: "scenarios/compound-haskell"
    hash: "TBD"
  - id: compound-c
    ref: "scenarios/compound-c"
    hash: "TBD"

design:
  type: full_factorial
  repetitions: 1
  parallelism: 4

comparisons:
  - id: scenario_language
    description: "How does the default profile perform across scenarios at the specific prompt level?"
    across: scenario
    holding_constant: [profile, model, prompt_id]

metrics:
  trace:
    capture:
      - tool_calls
      - tokens_in
      - tokens_out
      - latency_ms_per_turn
      - file_reads
      - context_size_per_turn
  evaluator:
    layers:
      - id: correctness
        type: oracle_script
        script: "oracle/run.sh"
        pass_condition: "exit_code == 0"
  judge: null

analysis:
  type: none
  emit:
    - results_table_csv
