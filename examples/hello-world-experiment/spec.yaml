metadata:
  id: walking-skeleton-001
  name: "Walking Skeleton — FizzBuzz bug fix"
  description: >
    Minimal end-to-end experiment. Validates that the framework
    can execute a matrix of runs and produce a valid Result Bundle.
  version: "0.1.0"
  author: "Diego"
  seed: 42
  framework_version: "0.1.0"
  harness:
    id: "pi"
    package: "@facet/harness-pi"
    version: "0.70.2"

environment:
  timeout_per_run_seconds: 300
  max_tokens_per_run: 50000
  max_total_cost_usd: 0.5
  workspace_strategy: "git_worktree"

varying_factors:
  - id: prompt_id
    description: "Which prompt variant from the scenario is used."
    levels:
      - id: underspecified
      - id: specific

  - id: profile
    description: "Pi configuration tuple."
    levels:
      - id: default
        ref: "@facet/preset-pi-default"
        hash: "sha256:4177c4c688febb958650363d595884de86c2ff0872166baccc106def850e608e"

  - id: model
    description: "OpenRouter model id."
    levels:
      - id: gemini-2.5-flash-lite
        provider: openrouter
        model_id: "google/gemini-2.5-flash-lite"

scenarios:
  - id: fizzbuzz-off-by-one
    ref: "scenarios/fizzbuzz-off-by-one"
    hash: "TBD"

design:
  type: full_factorial
  repetitions: 2
  parallelism: 1

comparisons:
  - id: prompt_effect
    description: "Does prompt specificity affect pass rate and trace behavior?"
    across: prompt_id
    holding_constant: [profile, model, scenario]

metrics:
  trace:
    capture:
      - tool_calls
      - tokens_in
      - tokens_out
      - latency_ms_per_turn
      - file_reads
      - context_size_per_turn
  evaluator:
    layers:
      - id: correctness
        type: oracle_script
        script: "oracle/run.sh"
        pass_condition: "exit_code == 0"
  judge: null

analysis:
  type: none
  emit:
    - results_table_csv
